[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfguard3"
dynamic = ["version"]
description = "Layered indirect prompt-injection protection around any LLM: no training, no internals, no extra LLM call."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
minicheck = ["torch", "transformers"]  # SupportTrace("minicheck") backend only
agentdojo = ["agentdojo", "openai"]     # eval/agentdojo_run.py only

[tool.setuptools]
packages = ["selfguard3", "selfguard3.engine"]

[tool.setuptools.package-data]
"selfguard3.engine" = ["frozen_config.json"]

[tool.setuptools.dynamic]
version = {attr = "selfguard3.__version__"}
